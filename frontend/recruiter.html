<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard | AI Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">AI Resume <span>Intelligence</span></div>
        <div class="nav-links">
            <a href="index.html">Upload Portal</a>
            <a href="recruiter.html" class="active">Recruiter Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1000px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">

            <button onclick="loadCandidates()" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">Refresh List</button>

            </p>

    <script src="js/app.js"></script>
